<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f5">
  <meta name="description" content="SeneSmart Smart Irrigation Control">
  <title>SeneSmart | Smart Irrigation</title>
  <link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
<script type="module">
    if ("serviceWorker" in navigator) {
      if (import.meta.env.DEV) {
        window.addEventListener("load", async () => {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));

          const keys = await caches.keys();
          await Promise.all(
            keys
              .filter(key => key.startsWith("senesmart-offline-"))
              .map(key => caches.delete(key))
          );

          console.info("SeneSmart development mode: service worker and old offline caches disabled.");
        }, { once: true });
      } else {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .catch(error => console.error("SeneSmart offline setup failed:", error));
        }, { once: true });
      }
    }
  </script>
</body>
</html>
